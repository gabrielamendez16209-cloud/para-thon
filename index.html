<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Tommy</title>

<link
href="https://fonts.googleapis.com/css2?family=Sail&display=swap"
rel="stylesheet">


<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #050302;
    font-family: Georgia, serif;
}


/* =========================
   GALAXIA
========================= */

.galaxia {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            ellipse at 50% 50%,
            rgba(130, 75, 48, 0.65),
            transparent 25%
        ),

        radial-gradient(
            ellipse at 30% 45%,
            rgba(93, 50, 35, 0.7),
            transparent 35%
        ),

        radial-gradient(
            ellipse at 70% 55%,
            rgba(110, 62, 40, 0.55),
            transparent 35%
        ),

        radial-gradient(
            circle,
            #24140d 0%,
            #100907 55%,
            #030202 100%
        );
}


/* =========================
   ESTRELLAS
========================= */

.estrella {
    position: absolute;

    width: 3px;
    height: 3px;

    background: #f0d9c4;

    border-radius: 50%;

    animation:
        brillo 3s infinite ease-in-out;
}


@keyframes brillo {

    0%, 100% {
        opacity: 0.2;
        transform: scale(0.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.6);
    }

}


/* =========================
   INICIO
========================= */

.inicio {
    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    text-align: center;

    color: #f0d9c4;

    transition:
        opacity 1s ease;

    z-index: 10;
}


.inicio h1 {

    margin: 0;

    font-size: 48px;

    font-weight: normal;

    letter-spacing: 4px;

    text-shadow:
        0 2px 15px rgba(0,0,0,0.8),
        0 0 25px rgba(130,75,48,0.5);
}


.subtitulo {

    margin-top: 18px;

    font-size: 18px;

    opacity: 0.8;
}


/* =========================
   BOTÓN
========================= */

#abrir {

    margin-top: 35px;

    padding: 12px 30px;

    background:
        rgba(35,20,13,0.65);

    border:
        1px solid rgba(240,217,196,0.55);

    border-radius: 30px;

    color: #f0d9c4;

    font-family: Georgia, serif;

    font-size: 17px;

    letter-spacing: 2px;

    cursor: pointer;

    transition: 0.4s;
}


#abrir:hover {

    background:
        rgba(130,75,48,0.45);

    border-color:
        #f0d9c4;

    transform:
        scale(1.05);
}


/* =========================
   PANTALLA DEL SOBRE
========================= */

.sobrePantalla {

    position: absolute;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    opacity: 0;

    transition:
        opacity 1s ease;

    z-index: 5;
}


/* =========================
   SOBRE
========================= */

.sobre {

    position: relative;

    width: 330px;
    height: 220px;

    background: #d8b99d;

    border-radius: 5px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.5),
        0 0 30px rgba(130,75,48,0.2);

    cursor: pointer;
}


/* TAPA */

.sobre::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 0;
    height: 0;

    border-left:
        165px solid transparent;

    border-right:
        165px solid transparent;

    border-top:
        120px solid #c9a78b;

    transform-origin: top;

    transition:
        transform 0.8s ease;

    z-index: 2;
}


/* PARTE DELANTERA */

.sobre::after {

    content: "";

    position: absolute;

    bottom: 0;
    left: 0;

    width: 0;
    height: 0;

    border-left:
        165px solid transparent;

    border-right:
        165px solid transparent;

    border-bottom:
        120px solid #b99375;

    z-index: 3;
}


/* =========================
   CORAZÓN PIXELADO
========================= */

.corazon {

    position: absolute;

    top: 50%;
    left: 50%;

    width: 70px;
    height: 70px;

    transform:
        translate(-50%, -50%);

    background: #17100e;

    z-index: 4;

    clip-path: polygon(

        0% 20%,
        14% 20%,
        14% 8%,
        28% 8%,
        28% 20%,

        42% 20%,
        42% 32%,
        58% 32%,
        58% 20%,

        72% 20%,
        72% 8%,
        86% 8%,
        86% 20%,
        100% 20%,

        100% 55%,
        86% 55%,
        86% 69%,
        72% 69%,
        72% 83%,
        58% 83%,
        58% 97%,

        42% 97%,
        42% 83%,
        28% 83%,
        28% 69%,
        14% 69%,
        14% 55%,
        0% 55%
    );

    animation:
        latido 1.8s infinite ease-in-out;
}


/* =========================
   PARTE ROJA
========================= */

.corazon span {

    position: absolute;

    top: 8px;
    left: 8px;

    width: 54px;
    height: 54px;

    background:
        linear-gradient(
            135deg,
            #ff4b4b 0%,
            #d92f2f 45%,
            #9e2020 100%
        );

    clip-path: polygon(

        0% 22%,
        16% 22%,
        16% 8%,
        30% 8%,
        30% 22%,

        44% 22%,
        44% 35%,
        56% 35%,
        56% 22%,

        70% 22%,
        70% 8%,
        86% 8%,
        86% 22%,
        100% 22%,

        100% 50%,
        86% 50%,
        86% 64%,
        72% 64%,
        72% 78%,
        58% 78%,
        58% 92%,

        42% 92%,
        42% 78%,
        28% 78%,
        28% 64%,
        14% 64%,
        14% 50%,
        0% 50%
    );
}


/* =========================
   BRILLO
========================= */

.corazon span::after {

    content: "";

    position: absolute;

    top: 10px;
    left: 12px;

    width: 10px;
    height: 10px;

    background: #ff7777;
}


/* =========================
   LATIDO
========================= */

@keyframes latido {

    0%, 100% {

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.08);
    }

}


/* =========================
   FRASES
========================= */

.instruccion {

    margin-top: 30px;

    color: #f0d9c4;

    font-family:
        'Sail',
        cursive;

    font-size: 24px;

    letter-spacing: 1px;

    text-shadow:
        0 0 12px
        rgba(240,217,196,0.35);

    opacity: 0.9;

    transition:
        opacity 0.4s ease;

    cursor: pointer;
}


/* =========================
   SOBRE ABIERTO
========================= */

.sobre.abierto::before {

    transform:
        rotateX(180deg);
}


.sobre.abierto .corazon {

    opacity: 0;

    transition:
        opacity 0.4s;
}


/* =========================
   CARTA
========================= */

.carta {

    position: absolute;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    overflow-y: auto;

    padding: 40px 20px;

    color: #2d211b;

    text-align: center;

    opacity: 0;

    transition:
        opacity 1.5s ease;

    z-index: 20;
}


.cartaContenido {

    position: relative;

    width: min(650px, 90%);

    min-height: 420px;

    padding: 55px 55px 45px;

    background: #ead8c3;

    color: #3a251c;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.65);

    overflow: hidden;

    cursor: pointer;
}


/* =========================
   MARCO
========================= */

.cartaContenido::before {

    content: "";

    position: absolute;

    inset: 20px;

    border:
        1px solid #765444;

    pointer-events: none;
}


.cartaContenido::after {

    content: "";

    position: absolute;

    inset: 29px;

    border:
        1px solid #b39178;

    pointer-events: none;
}


/* =========================
   ADORNOS
========================= */

.adornos {

    position: absolute;

    inset: 10px;

    pointer-events: none;

    z-index: 2;
}


.adornos span {

    position: absolute;

    width: 35px;
    height: 35px;

    border-color: #765444;
}


.a1 {

    top: 0;
    left: 0;

    border-top:
        3px solid;

    border-left:
        3px solid;
}


.a2 {

    top: 0;
    right: 0;

    border-top:
        3px solid;

    border-right:
        3px solid;
}


.a3 {

    bottom: 0;
    left: 0;

    border-bottom:
        3px solid;

    border-left:
        3px solid;
}


.a4 {

    bottom: 0;
    right: 0;

    border-bottom:
        3px solid;

    border-right:
        3px solid;
}


/* =========================
   CONTENIDO
========================= */

.contenidoCarta {

    position: relative;

    z-index: 3;
}


/* =========================
   PARA TOMMY
========================= */

.carta h2 {

    margin:
        -15px 0 25px;

    font-family:
        'Sail',
        cursive;

    font-size: 40px;

    font-weight: normal;

    color: #3a251c;
}


/* =========================
   POEMA
========================= */

.poema {

    margin-top: 0;

    font-family:
        'Sail',
        cursive;

    font-size: 27px;

    font-weight: normal;

    line-height: 1.55;

    white-space: pre-line;

    color: #3a251c;
}


/* =========================
   AUTOR
========================= */

.autor {

    margin-top: 25px;

    font-family:
        'Sail',
        cursive;

    font-size: 24px;

    color: #3a251c;
}


/* =========================
   PRESIONAR CARTA
========================= */

.presionarCarta {

    margin-top: 22px;

    color: #f0d9c4;

    font-family:
        'Sail',
        cursive;

    font-size: 23px;

    letter-spacing: 1px;

    opacity: 0.9;

    text-shadow:
        0 0 12px
        rgba(240,217,196,0.35);

    cursor: pointer;

    transition:
        opacity 0.6s ease;
}


/* =========================
   FINAL
========================= */

.final {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    color: #f0d9c4;

    font-family:
        'Sail',
        cursive;

    font-size: 55px;

    letter-spacing: 3px;

    opacity: 0;

    text-shadow:
        0 0 20px
        rgba(240,217,196,0.5);

    transition:
        opacity 2s ease;

    z-index: 30;
}


/* =========================
   FRASES DEL FINAL
========================= */

.palabrasFinal {

    position: absolute;

    inset: 0;

    pointer-events: none;
}


.palabra {

    position: absolute;

    color: #f0d9c4;

    font-family:
        'Sail',
        cursive;

    font-size: 27px;

    font-weight: normal;

    letter-spacing: 1px;

    opacity: 0;

    text-shadow:
        0 0 12px
        rgba(240,217,196,0.3);

    animation:
        aparecerPalabra 5s ease-in-out forwards;
}


@keyframes aparecerPalabra {

    0% {

        opacity: 0;

        transform:
            scale(0.85);
    }

    20% {

        opacity: 0.65;

        transform:
            scale(1);
    }

    70% {

        opacity: 0.65;

        transform:
            scale(1);
    }

    100% {

        opacity: 0;

        transform:
            scale(0.92);
    }

}


/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .inicio h1 {
        font-size: 40px;
    }

    .subtitulo {
        font-size: 16px;
    }

    .sobre {
        width: 290px;
        height: 200px;
    }

    .sobre::before {
        border-left-width: 145px;
        border-right-width: 145px;
    }

    .sobre::after {
        border-left-width: 145px;
        border-right-width: 145px;
    }

    .carta {
        padding: 25px 10px;
    }

    .cartaContenido {

        width: 94%;

        min-height: 380px;

        padding:
            50px 30px 40px;
    }

    .carta h2 {

        font-size: 34px;

        margin-bottom: 20px;
    }

    .poema {

        font-size: 22px;

        line-height: 1.5;
    }

    .autor {

        font-size: 22px;

        margin-top: 20px;
    }

    .presionarCarta {

        font-size: 21px;

    }

    .final {

        font-size: 45px;

    }

    .palabra {

        font-size: 23px;

    }

}

</style>

</head>


<body>


<!-- =========================
     CANCIÓN
========================= -->

<audio
    id="musica"
    loop
    preload="auto">

    <source
        src="lo que siento-CUCO.mpeg"
        type="audio/mpeg">

</audio>


<!-- =========================
     GALAXIA
========================= -->

<div
    class="galaxia"
    id="galaxia">
</div>


<!-- =========================
     INICIO
========================= -->

<div
    class="inicio"
    id="inicio">

    <h1>
        Para Tommy
    </h1>

    <div class="subtitulo">

        ✰ Para you۶ৎ

    </div>


    <button
        id="abrir"
        type="button">

        abrir

    </button>

</div>


<!-- =========================
     SOBRE
========================= -->

<div
    class="sobrePantalla"
    id="sobrePantalla">


    <div
        class="sobre"
        id="sobre">


        <div
            class="corazon">

            <span></span>

        </div>


    </div>


    <div
        class="instruccion"
        id="instruccion">

        hay algo para ti...

    </div>


</div>


<!-- =========================
     CARTA
========================= -->

<div
    class="carta"
    id="carta">


    <div
        class="cartaContenido"
        id="cartaContenido">


        <div class="adornos">

            <span class="a1"></span>

            <span class="a2"></span>

            <span class="a3"></span>

            <span class="a4"></span>

        </div>


        <div class="contenidoCarta">


            <h2>
                Para Tommy
            </h2>


            <div class="poema">

Me perdí en su mirada, es que el color de sus ojos 
me encantaban, no eran ni azules, ni eran verdes. 
Eran color café, café que quita el sueño 
café que producen desvelos.

            </div>


            <div class="autor">

                - Mario Benedetti -

            </div>


        </div>


    </div>


    <div
        class="presionarCarta"
        id="presionarCarta">

        presiona la carta...

    </div>


</div>


<!-- =========================
     FINAL
========================= -->

<div
    class="final"
    id="final">

    <div
        class="palabrasFinal"
        id="palabrasFinal">
    </div>

    <div class="textoFinal">
        Att. Ale
    </div>

</div>


<script>

/* =========================
   ESTRELLAS
========================= */

const galaxia =
    document.getElementById("galaxia");


for (
    let i = 0;
    i < 180;
    i++
) {

    const estrella =
        document.createElement("div");


    estrella.className =
        "estrella";


    estrella.style.left =
        Math.random() * 100 + "%";


    estrella.style.top =
        Math.random() * 100 + "%";


    estrella.style.animationDelay =
        Math.random() * 4 + "s";


    galaxia.appendChild(
        estrella
    );

}


/* =========================
   ELEMENTOS
========================= */

const botonAbrir =
    document.getElementById("abrir");

const inicio =
    document.getElementById("inicio");

const sobrePantalla =
    document.getElementById("sobrePantalla");

const sobre =
    document.getElementById("sobre");

const instruccion =
    document.getElementById("instruccion");

const carta =
    document.getElementById("carta");

const cartaContenido =
    document.getElementById("cartaContenido");

const presionarCarta =
    document.getElementById("presionarCarta");

const final =
    document.getElementById("final");

const musica =
    document.getElementById("musica");

const palabrasFinal =
    document.getElementById("palabrasFinal");


/* =========================
   ESTADO
========================= */

let estadoSobre = 0;


/* =========================
   MÚSICA
========================= */

function reproducirMusica() {

    musica.volume = 0.45;

    const promesa =
        musica.play();

    if (promesa !== undefined) {

        promesa
        .then(function() {

            console.log(
                "La música comenzó correctamente."
            );

        })
        .catch(function(error) {

            console.log(
                "Error al reproducir la música:",
                error
            );

        });

    }

}


/* =========================
   BOTÓN ABRIR
========================= */

botonAbrir.addEventListener(
    "click",
    function() {

        reproducirMusica();


        inicio.style.opacity =
            "0";


        setTimeout(
            function() {

                inicio.style.display =
                    "none";


                sobrePantalla.style.display =
                    "flex";


                setTimeout(
                    function() {

                        sobrePantalla.style.opacity =
                            "1";

                    },
                    50
                );

            },
            1000
        );

    }
);


/* =========================
   TOQUES DEL SOBRE
========================= */

sobre.addEventListener(
    "click",
    function() {

        estadoSobre++;


        /* PRIMER TOQUE */

        if (
            estadoSobre === 1
        ) {

            instruccion.textContent =
                "ay, ya me dio pena...";


            instruccion.style.transform =
                "scale(1.05)";


            return;

        }


        /* SEGUNDO TOQUE */

        if (
            estadoSobre === 2
        ) {

            sobre.classList.add(
                "abierto"
            );


            instruccion.style.opacity =
                "0";


            setTimeout(
                function() {

                    sobrePantalla.style.opacity =
                        "0";


                    setTimeout(
                        function() {

                            sobrePantalla.style.display =
                                "none";


                            carta.style.display =
                                "flex";


                            setTimeout(
                                function() {

                                    carta.style.opacity =
                                        "1";

                                },
                                50
                            );

                        },
                        1000
                    );

                },
                1200
            );

        }

    }
);


/* =========================
   FRASES DEL FINAL
========================= */

const frases = [

    "Je t'aime",
    "I love you",
    "Ti amo",
    "Ich liebe dich",
    "Te iubesc",
    "Eu te amo",
    "Mahal kita",
    "Ik hou van jou"

];


const posiciones = [

    {
        top: "24%",
        left: "16%"
    },

    {
        top: "28%",
        right: "14%"
    },

    {
        top: "68%",
        left: "11%"
    },

    {
        top: "72%",
        right: "12%"
    },

    {
        top: "14%",
        left: "50%",
        transform: "translateX(-50%)"
    },

    {
        top: "83%",
        left: "50%",
        transform: "translateX(-50%)"
    },

    {
        top: "43%",
        left: "8%"
    },

    {
        top: "50%",
        right: "7%"
    }

];


let indiceFrase = 0;

let intervaloPalabras = null;


function mostrarPalabra() {

    const palabra =
        document.createElement("div");


    palabra.className =
        "palabra";


    palabra.textContent =
        frases[indiceFrase];


    const posicion =
        posiciones[indiceFrase];


    Object.assign(
        palabra.style,
        posicion
    );


    palabrasFinal.appendChild(
        palabra
    );


    indiceFrase++;


    if (
        indiceFrase >= frases.length
    ) {

        indiceFrase = 0;

    }


    setTimeout(
        function() {

            palabra.remove();

        },
        5000
    );

}


/* =========================
   CERRAR CARTA
========================= */

function cerrarCarta() {

    carta.style.opacity =
        "0";


    setTimeout(
        function() {

            carta.style.display =
                "none";


            final.style.display =
                "flex";


            setTimeout(
                function() {

                    final.style.opacity =
                        "1";


                    mostrarPalabra();


                    if (
                        !intervaloPalabras
                    ) {

                        intervaloPalabras =
                            setInterval(
                                mostrarPalabra,
                                2200
                            );

                    }

                },
                50
            );

        },
        1500
    );

}


/* =========================
   TOCAR LA CARTA
========================= */

cartaContenido.addEventListener(
    "click",
    function() {

        cerrarCarta();

    }
);


/* =========================
   TOCAR "PRESIONA LA CARTA"
========================= */

presionarCarta.addEventListener(
    "click",
    function() {

        cerrarCarta();

    }
);

</script>


</body>

</html>
